<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Ambulance Dispatch</title>

    <link rel="stylesheet"
          href="login.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            🚑
        </div>

        <h1>Ambulance Dispatch</h1>

        <p class="subtitle">
            Nearest Ambulance Allocation System
        </p>

        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

            </div>

            <button
                    type="submit"
                    id="loginButton">

                LOGIN

            </button>

        </form>

        <div
                id="loginMessage"
                class="login-message hidden">
        </div>

        <div class="demo-users">

            <h3>Demo Accounts</h3>

            <p>
                <strong>Admin:</strong>
                admin / admin123
            </p>

            <p>
                <strong>Dispatcher:</strong>
                dispatcher / dispatch123
            </p>

            <p>
                <strong>User:</strong>
                user / user123
            </p>

        </div>

    </div>

</div>

<script src="login.js"></script>

</body>

</html>
